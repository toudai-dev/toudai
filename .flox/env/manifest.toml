schema-version = "1.15.0"

[install]

opentofu.pkg-path = "opentofu"
packer.pkg-path = "packer"
google-cloud-sdk.pkg-path = "google-cloud-sdk"
jq.pkg-path = "jq"
curl.pkg-path = "curl"
fio.pkg-path = "fio"
sysstat.pkg-path = "sysstat"
clickhouse.pkg-path = "clickhouse-lts"
