[package]
name = "toudai-ingest"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.22"
clickhouse = "0.15"
http = "1"
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic", "logs", "trace"] }
ryu = "1.0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
tonic = { version = "0.14", features = ["gzip", "zstd"] }
tower = { version = "0.5", features = ["util"] }
toudai = { path = ".." }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
