[package]
name = "toudai-ingest"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# Exposes `fuzzing`, the checks the cargo-fuzz targets in `fuzz/` run.
fuzzing = []

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
clickhouse = "0.15"
flate2 = "1"
http = "1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["http1", "server-graceful", "service", "tokio"] }
lz4_flex = "0.14"
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic", "logs", "trace", "with-serde"] }
prost = "0.14"
ryu = "1.0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
snap = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tonic = { version = "0.14", features = ["gzip", "zstd"] }
tower = { version = "0.5", features = ["util"] }
toudai = { path = ".." }
uuid = { version = "1", features = ["v7"] }
zstd = "0.14"

[dev-dependencies]
proptest = "1.12"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
