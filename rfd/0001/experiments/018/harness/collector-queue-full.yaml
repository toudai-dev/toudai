# Experiment 018 phase 4b: bounded queue under a stalled downstream.
#
# The downstream is a TCP listener that accepts and never responds. With one
# consumer, a 1s export timeout, and retries disabled, each queued item occupies
# the consumer for ~1s, so a small queue overflows under a burst and the
# producer-visible rejection path can be measured.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318

exporters:
  clickhouse:
    endpoint: tcp://127.0.0.1:19100
    database: lh018
    logs_table_name: otel_logs_faults
    create_schema: false
    timeout: 1s
    retry_on_failure:
      enabled: false
    sending_queue:
      enabled: true
      num_consumers: 1
      queue_size: 2

service:
  telemetry:
    logs:
      level: info
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 8888
  pipelines:
    logs:
      receivers: [otlp]
      exporters: [clickhouse]
