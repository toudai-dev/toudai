# Experiment 021 gateway: two synthetic credentials bound to two workspaces, the
# trusted workspace/dataset/marker injected by a resource processor before the
# exporter, and one shared lighthouse exporter instance for both workspace
# pipelines so a single downstream batch can carry both workspaces.
#
# Credential validation is real authentication in this distribution:
# bearertokenauth/gateway (the pinned v0.161.0 extension) rejects unknown tokens
# with HTTP 401 before routing. The routing conditions only select a pipeline;
# they are not the authentication step.
#
# The exporter knobs are environment-overridable so the same real pipeline
# (credential -> routing -> trusted injection -> shared owned exporter) runs the
# semantics, acknowledgement, outage, queue-full, permanent-failure, and
# ambiguous-insert phases. Only the crash phase, which needs file_storage, has a
# separate config.
extensions:
  bearertokenauth/gateway:
    tokens: [lh021-ws-a-key, lh021-ws-b-key]

receivers:
  otlp/gateway:
    protocols:
      http:
        endpoint: 127.0.0.1:${env:LH021_OTLP_PORT:-4338}
        include_metadata: true
        auth:
          authenticator: bearertokenauth/gateway

processors:
  resource/ws-a:
    attributes:
      - key: lighthouse.workspace_id
        action: upsert
        value: 11111111-1111-4111-8111-111111111111
      - key: lighthouse.dataset
        action: upsert
        value: fixture
      # Misconfiguration marker: the exporter requires it, so a pipeline that
      # forgets the trusted-scope processor fails closed instead of trusting a
      # producer-supplied workspace.
      - key: lighthouse.scope_source
        action: upsert
        value: gateway
  resource/ws-b:
    attributes:
      - key: lighthouse.workspace_id
        action: upsert
        value: 22222222-2222-4222-8222-222222222222
      - key: lighthouse.dataset
        action: upsert
        value: fixture
      - key: lighthouse.scope_source
        action: upsert
        value: gateway

connectors:
  routing/logs:
    default_pipelines: [logs/quarantine]
    table:
      - condition: otelcol.client.metadata["authorization"][0] == "Bearer lh021-ws-a-key"
        pipelines: [logs/ws-a]
      - condition: otelcol.client.metadata["Authorization"][0] == "Bearer lh021-ws-a-key"
        pipelines: [logs/ws-a]
      - condition: otelcol.client.metadata["authorization"][0] == "Bearer lh021-ws-b-key"
        pipelines: [logs/ws-b]
      - condition: otelcol.client.metadata["Authorization"][0] == "Bearer lh021-ws-b-key"
        pipelines: [logs/ws-b]
  routing/traces:
    default_pipelines: [traces/quarantine]
    table:
      - condition: otelcol.client.metadata["authorization"][0] == "Bearer lh021-ws-a-key"
        pipelines: [traces/ws-a]
      - condition: otelcol.client.metadata["Authorization"][0] == "Bearer lh021-ws-a-key"
        pipelines: [traces/ws-a]
      - condition: otelcol.client.metadata["authorization"][0] == "Bearer lh021-ws-b-key"
        pipelines: [traces/ws-b]
      - condition: otelcol.client.metadata["Authorization"][0] == "Bearer lh021-ws-b-key"
        pipelines: [traces/ws-b]

exporters:
  lighthouse:
    endpoint: ${env:LH021_ENDPOINT:-127.0.0.1:19101}
    database: ${env:LH021_DATABASE:-lh021}
    timeout: ${env:LH021_TIMEOUT:-10s}
    log_batch_summaries: ${env:LH021_LOG_BATCH:-true}
    retry_on_failure:
      enabled: ${env:LH021_RETRY_ENABLED:-true}
      initial_interval: ${env:LH021_RETRY_INITIAL:-200ms}
      max_interval: ${env:LH021_RETRY_MAX_INTERVAL:-1s}
      max_elapsed_time: ${env:LH021_RETRY_MAX_ELAPSED:-10s}
    sending_queue:
      enabled: ${env:LH021_QUEUE_ENABLED:-true}
      num_consumers: ${env:LH021_QUEUE_CONSUMERS:-1}
      queue_size: ${env:LH021_QUEUE_SIZE:-1000}
      batch:
        # min_size is the trigger that merges the four single-record requests
        # from both workspaces into one downstream export (see phase_semantics);
        # flush_timeout is the safety net for batches that stay below min_size.
        # The v0.161 queue batch config requires an explicit sizer.
        sizer: items
        min_size: ${env:LH021_BATCH_MIN:-4}
        flush_timeout: ${env:LH021_BATCH_FLUSH:-300ms}
  file/quarantine-logs:
    path: ${env:LH021_RESULTS}/quarantine-logs.jsonl
    format: json
  file/quarantine-traces:
    path: ${env:LH021_RESULTS}/quarantine-traces.jsonl
    format: json

service:
  extensions: [bearertokenauth/gateway]
  telemetry:
    logs:
      level: info
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: ${env:LH021_METRICS_PORT:-8891}
  pipelines:
    logs/gateway:
      receivers: [otlp/gateway]
      exporters: [routing/logs]
    logs/ws-a:
      receivers: [routing/logs]
      processors: [resource/ws-a]
      exporters: [lighthouse]
    logs/ws-b:
      receivers: [routing/logs]
      processors: [resource/ws-b]
      exporters: [lighthouse]
    logs/quarantine:
      receivers: [routing/logs]
      exporters: [file/quarantine-logs]
    traces/gateway:
      receivers: [otlp/gateway]
      exporters: [routing/traces]
    traces/ws-a:
      receivers: [routing/traces]
      processors: [resource/ws-a]
      exporters: [lighthouse]
    traces/ws-b:
      receivers: [routing/traces]
      processors: [resource/ws-b]
      exporters: [lighthouse]
    traces/quarantine:
      receivers: [routing/traces]
      exporters: [file/quarantine-traces]
