# Experiment 019 identity-ordering probe: a trusted workspace attribute is
# injected from the credential-selected pipeline (Experiment 018's tested stock
# mechanism) before any mapping step, and the managed schema stores it. This
# checks the ordering boundary a canonicalization step would sit behind; it does
# not implement or test a custom mapping component.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4328
        include_metadata: true

connectors:
  routing/logs:
    default_pipelines: [logs/quarantine]
    table:
      - condition: otelcol.client.metadata["authorization"][0] == "Bearer lh019-ws-a-key"
        pipelines: [logs/ws-a]

processors:
  resource/ws-a:
    attributes:
      - key: lighthouse.workspace_id
        action: upsert
        value: 11111111-1111-4111-8111-111111111111

exporters:
  clickhouse:
    endpoint: tcp://127.0.0.1:19001
    database: lh019
    create_schema: false
    logs_table_name: managed_logs
    traces_table_name: managed_traces
    async_insert: true
    timeout: 5s
    retry_on_failure:
      enabled: true
      initial_interval: 200ms
      max_interval: 1s
      max_elapsed_time: 5s

  file/quarantine-logs:
    path: ${env:LH019_RESULTS}/quarantine-logs.jsonl
    format: json

service:
  telemetry:
    logs:
      level: info
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 8889
  pipelines:
    logs/in:
      receivers: [otlp]
      exporters: [routing/logs]
    logs/ws-a:
      receivers: [routing/logs]
      processors: [resource/ws-a]
      exporters: [clickhouse]
    logs/quarantine:
      receivers: [routing/logs]
      exporters: [file/quarantine-logs]
