# Experiment 019 stock control A: the stock ClickHouse exporter in its default
# Map mode, create_schema: true. This reproduces the Experiment 018 mapping on
# the 019 fixture and captures the exact serving strings the Map stores.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4328

exporters:
  clickhouse:
    endpoint: tcp://127.0.0.1:19001
    database: stock_map
    create_schema: true
    async_insert: true
    timeout: 5s
    retry_on_failure:
      enabled: true
      initial_interval: 200ms
      max_interval: 1s
      max_elapsed_time: 5s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 1000

  file/received-logs:
    path: ${env:LH019_RESULTS}/stock-map-received-logs.jsonl
    format: json

  file/received-traces:
    path: ${env:LH019_RESULTS}/stock-map-received-traces.jsonl
    format: json

service:
  telemetry:
    logs:
      level: info
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 8889
  pipelines:
    logs:
      receivers: [otlp]
      exporters: [clickhouse, file/received-logs]
    traces:
      receivers: [otlp]
      exporters: [clickhouse, file/received-traces]
