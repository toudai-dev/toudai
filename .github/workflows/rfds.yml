---
name: rfds

"on":
  push:
    branches:
      - main
    paths:
      - "rfd/**"
      - "scripts/check-rfd-status*.sh"
      - "Makefile"
      - ".github/workflows/rfds.yml"
  pull_request:
    paths:
      - "rfd/**"
      - "scripts/check-rfd-status*.sh"
      - "Makefile"
      - ".github/workflows/rfds.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Asciidoctor
        # Same version as the Nix development shell.
        run: sudo gem install asciidoctor --version 2.0.26 --no-document
      - name: Check RFDs
        run: make check-rfds
