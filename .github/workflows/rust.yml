---
name: rust

"on":
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Match the ClickHouse the Nix development shell and the benchmark harness pin.
# The fixture tests run generated SQL under `clickhouse local`; the archive is
# verified against the SHA-512 published with the release.
env:
  CLICKHOUSE_VERSION: 26.8.2.7
  CLICKHOUSE_SHA512: 3f0d06f897dda0ffdff8e84dc6b1494611ef9b0b590422fbcf9900a4bac9d16fc0a621327965f8c1edbc8f1d20a8d7d333c88eff999f65cdec4229b91ccb1719

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            fixture-emitter/target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Clippy (fixture emitter)
        run: cargo clippy --all-targets --all-features --manifest-path fixture-emitter/Cargo.toml -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt
      - name: Format check
        run: cargo fmt --check
      - name: Format check (fixture emitter)
        run: cargo fmt --check --manifest-path fixture-emitter/Cargo.toml

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            fixture-emitter/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache ClickHouse
        id: clickhouse-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/clickhouse
          key: clickhouse-${{ env.CLICKHOUSE_VERSION }}-${{ env.CLICKHOUSE_SHA512 }}
      - name: Install ClickHouse
        if: steps.clickhouse-cache.outputs.cache-hit != 'true'
        run: |
          archive="clickhouse-common-static-${CLICKHOUSE_VERSION}-amd64.tgz"
          curl -fsSL -o "${archive}" \
            "https://github.com/ClickHouse/ClickHouse/releases/download/v${CLICKHOUSE_VERSION}-lts/${archive}"
          echo "${CLICKHOUSE_SHA512}  ${archive}" | sha512sum --check
          mkdir -p ~/clickhouse
          tar -xzf "${archive}" -C ~/clickhouse --strip-components=3 \
            "clickhouse-common-static-${CLICKHOUSE_VERSION}/usr/bin/clickhouse"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Test
        # Fail instead of skipping the ClickHouse-backed fixture tests.
        env:
          TOUDAI_REQUIRE_CLICKHOUSE: "1"
        run: |
          export TOUDAI_CLICKHOUSE_BIN="${HOME}/clickhouse/clickhouse"
          "${TOUDAI_CLICKHOUSE_BIN}" --version
          cargo test --all-targets
      - name: Test (fixture emitter)
        run: |
          cargo test --all-targets --manifest-path fixture-emitter/Cargo.toml
          fixture-emitter/check-reproducible.sh
