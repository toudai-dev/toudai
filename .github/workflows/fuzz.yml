---
name: fuzz

# Daily, by hand, and on changes to the fuzz targets or the checks they run.
# Fuzzing pays off over minutes per target, too slow for every pull request;
# the same checks run as property tests in `cargo test` there.
"on":
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to fuzz each target
        default: "900"
  pull_request:
    paths:
      - ingest/fuzz/**
      - ingest/src/fuzzing.rs
      - ingest/Cargo.toml
      - .github/workflows/fuzz.yml

permissions:
  contents: read

# cargo-fuzz builds with `-Zsanitizer=address`, which only a nightly compiler
# accepts. A dated nightly keeps an upstream regression from failing this job
# (nightly-2026-11-01 cannot compile the `clickhouse` crate); bump it on
# purpose, after `cargo fuzz build` passes with the new one.
env:
  NIGHTLY: nightly-2026-11-08
  CARGO_FUZZ_VERSION: 0.13.2
  SECONDS_PER_TARGET: ${{ github.event_name == 'pull_request' && '60' || inputs.seconds || '900' }}

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [http_body, grpc_body, json_round_trip]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.NIGHTLY }}
          components: rustfmt
      # The root workspace's checks do not cover this standalone crate.
      - name: Format check
        run: cargo fmt --check --manifest-path ingest/fuzz/Cargo.toml
      - name: Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-fuzz
            ingest/fuzz/target
          key: ${{ runner.os }}-fuzz-${{ env.NIGHTLY }}-${{ env.CARGO_FUZZ_VERSION }}-${{ hashFiles('ingest/fuzz/Cargo.lock') }}
      - name: Install cargo-fuzz
        run: |
          if ! cargo fuzz --version 2>/dev/null | grep -q "${CARGO_FUZZ_VERSION}"; then
            cargo install cargo-fuzz --version "${CARGO_FUZZ_VERSION}" --locked --force
          fi
      # Each run starts from the last run's corpus plus the fixture seeds.
      - name: Restore corpus
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ingest/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Seed corpus
        run: ingest/fuzz/seed.sh
      - name: Fuzz
        working-directory: ingest
        run: >-
          cargo +"${NIGHTLY}" fuzz run "${{ matrix.target }}" --
          -max_total_time="${SECONDS_PER_TARGET}" -timeout=10 -rss_limit_mb=4096
      - name: Minimize corpus
        working-directory: ingest
        run: cargo +"${NIGHTLY}" fuzz cmin "${{ matrix.target }}"
      - name: Save corpus
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ingest/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - name: Upload crash
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: ingest/fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
